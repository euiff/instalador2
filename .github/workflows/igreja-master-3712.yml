name: Igreja Master 3.7.12 data migration inspect
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/igreja-master-3.7.12-enuves-migration
      - run: python3 adminigreja-updates/staging/3.7.12/inspect_release.py
