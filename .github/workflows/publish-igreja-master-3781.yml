name: Publish Igreja Master 3.7.81 In-app Document Viewer and Android Safe Area
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-igreja-master-3781.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate PHP, JavaScript, viewer actions and mobile safe area
        shell: bash
        run: |
          set -euo pipefail
          root=adminigreja-updates/staging/3.7.81/public
          php -l "$root/finance.php"
          php -l "$root/finance-entry-edit.php"
          php -l "$root/lib/View.php"
          node --check "$root/assets/finance-document-preview-3781.js"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('adminigreja-updates/staging/3.7.81/public')
          edit=(p/'finance-entry-edit.php').read_text()
          finance=(p/'finance.php').read_text()
          view=(p/'lib/View.php').read_text()
          script=(p/'assets/finance-document-preview-3781.js').read_text()
          css=(p/'assets/mobile-safe-area-3781.css').read_text()
          assert (p/'VERSION').read_text().strip()=='3.7.81'
          assert 'data-im-preview-display' in finance and 'data-im-preview-display' in edit
          assert 'finance-document-preview-3781.js?v=3.7.81' in finance
          assert 'finance-document-preview-3781.js?v=3.7.81' in edit
          assert '<th>Docs.</th><th>Ações</th><th>Data</th>' in finance
          assert 'finance-ocr-3752.js?v=3.7.77' in finance
          assert 'finance-ledger-filters-3775.js?v=3.7.75' in finance
          assert "data-finance-preview" in finance and "data-finance-preview" in edit
          assert 'data-im-preview-download' in finance and 'data-im-preview-download' in edit
          assert "credentials:'same-origin'" in script
          assert 'application/pdf' in script and 'image/png' in script
          assert '/assets/vendor/pdfjs/pdf.min.js' in script
          assert '/assets/vendor/pdfjs/pdf.worker.min.js' in script
          assert 'page.render(' in script and 'window.open(' not in script
          assert 'mobile-safe-area-3781.css?v=3.7.81' in view
          assert 'env(safe-area-inset-bottom' in css
          assert 'padding-bottom' in css and '.im-mobile-nav' in css
          assert 'DROP TABLE' not in finance and 'DROP TABLE' not in edit
          print('PASS: secure document preview fetch, PDF/image render, separate optional download and Android/tablet safe area')
          PY
      - name: Bundle pinned self-hosted PDF.js for private previews
        shell: bash
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          cd "$tmp"
          npm init -y >/dev/null
          npm install --no-save --ignore-scripts --no-audit --no-fund pdfjs-dist@3.11.174
          dest="$GITHUB_WORKSPACE/adminigreja-updates/staging/3.7.81/public/assets/vendor/pdfjs"
          mkdir -p "$dest"
          cp node_modules/pdfjs-dist/build/pdf.min.js "$dest/pdf.min.js"
          cp node_modules/pdfjs-dist/build/pdf.worker.min.js "$dest/pdf.worker.min.js"
          test -s "$dest/pdf.min.js" && test -s "$dest/pdf.worker.min.js"
          node --check "$dest/pdf.min.js"
          node --check "$dest/pdf.worker.min.js"
      - name: Publish verified incremental update on Master channel
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import io,tarfile,base64,hashlib,json
          base=Path('adminigreja-updates')
          manifest=base/'latest.json'
          current=json.loads(manifest.read_text())
          if current['version']=='3.7.81':
              print('3.7.81 already published')
              raise SystemExit(0)
          assert current['version']=='3.7.80','Unexpected previous version: '+str(current['version'])
          stage=base/'staging/3.7.81'
          paths=[
              'public/finance.php',
              'public/finance-entry-edit.php',
              'public/lib/View.php',
              'public/assets/mobile-safe-area-3781.css',
              'public/assets/finance-document-preview-3781.js',
              'public/assets/vendor/pdfjs/pdf.min.js',
              'public/assets/vendor/pdfjs/pdf.worker.min.js',
              'public/VERSION'
          ]
          files={p:(stage/p).read_bytes() for p in paths}
          stream=io.BytesIO()
          with tarfile.open(fileobj=stream,mode='w:gz') as tar:
              for p in paths:tar.add(stage/p,arcname=p,recursive=False)
          binary=stream.getvalue()
          with tarfile.open(fileobj=io.BytesIO(binary),mode='r:gz') as tar:
              for p in paths:assert tar.extractfile(p).read()==files[p]
          encoded=base64.b64encode(binary)
          parts=[]
          for start in range(0,len(encoded),60000):
              name=f'releases/v3.7.81.{len(parts)+1:02d}.b64.txt'
              (base/name).write_bytes(encoded[start:start+60000])
              parts.append(name)
          release={
              'version':'3.7.81','min_php':'8.1','encoding':'base64',
              'parts':parts,'sha256':hashlib.sha256(binary).hexdigest(),
              'files':[{'path':p,'sha256':hashlib.sha256(contents).hexdigest()} for p,contents in files.items()],
              'notes':[
                  'Documentos financeiros: visualizar PDFs e imagens diretamente na tela, sem download automático de finance-document.php.',
                  'PDFs são renderizados como páginas roláveis no leitor PDF.js incluído no próprio sistema; não exige aplicativo de PDF no Android.',
                  'Botão Baixar fica separado e opcional, visível somente depois de carregar e validar o documento.',
                  'Exibição funciona também na tela Editar lançamento e na listagem de movimentações da Tesouraria.',
                  'Barra inferior e botões no celular/tablet respeitam áreas seguras e reservam espaço acima da navegação do Android.',
                  'Visualização somente com sessão ativa e permissão de documento existente, sem tornar os comprovantes públicos.',
                  'Mantidas as alterações financeiras e o layout da 3.7.80, demais formulários, anexos, permissões e dados.',
                  'Testes automatizados de sintaxe PHP/JS; testar documentos reais no Android e tablet após instalar.'
              ]}
          manifest.write_text(json.dumps(release,ensure_ascii=False,indent=2)+'\n')
          print('PUBLISHED',release['version'],'files',len(paths),'parts',len(parts))
          PY
          git config user.name "Igreja Master Update Bot"
          git config user.email "actions@users.noreply.github.com"
          git add adminigreja-updates/latest.json adminigreja-updates/releases/v3.7.81.*.b64.txt
          git diff --cached --quiet && exit 0
          git commit -m "Publish Igreja Master 3.7.81 PDF viewer and mobile safe-area"
          git pull --rebase origin main
          git push origin HEAD:main
