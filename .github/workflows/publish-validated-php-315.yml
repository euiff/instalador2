name: Publish validated PHP 3.1.5 bridge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-validated-php-315.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download validated bridge artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-6054-820e-bdc6-ee63012e0a0e/raw?se=2026-10-08T00%3A53%3A30Z&sp=r&sv=2026-02-06&sr=b&scid=50b9dc3e-b5d4-5815-8d56-56505e17c2fa&skoid=db6dad9e-03ee-465b-aef6-ce0f63a161dc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-07T10%3A07%3A20Z&ske=2026-10-08T10%3A07%3A20Z&sks=b&skv=2026-02-06&sig=CBynjDawjT4V35jzNU49oR3C%2Bm9onbWNDouYF0CuDJI%3D' -o /tmp/bridge315.zip
          echo '084e84b7e449a49c0e65c9bdb555fedea407c7d5522e51b6fcbd019a3da18a03  /tmp/bridge315.zip' | sha256sum -c -
          rm -rf /tmp/bridge315
          mkdir -p /tmp/bridge315
          unzip -q /tmp/bridge315.zip -d /tmp/bridge315

      - name: Validate bridge content
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import base64, hashlib, json, pathlib
          root=pathlib.Path('/tmp/bridge315')
          latest=list(root.rglob('latest.json'))
          if len(latest)!=1:
              raise SystemExit(f'expected one latest.json, found {len(latest)}')
          src=latest[0].parent
          m=json.loads((src/'latest.json').read_text(encoding='utf-8'))
          if m.get('version')!='3.1.5': raise SystemExit('unexpected version')
          if len(m.get('parts',[]))!=23: raise SystemExit('unexpected part count')
          if len(m.get('files',[]))!=104: raise SystemExit('unexpected file count')
          encoded=''.join((src/p).read_text(encoding='utf-8').strip() for p in m['parts'])
          gz=base64.b64decode(encoded,validate=True)
          got=hashlib.sha256(gz).hexdigest()
          if got!='d47b202690484059a679126f1c862975fe32308a5752a030b2c4463f2efd4f44':
              raise SystemExit(f'package sha mismatch: {got}')
          if got.lower()!=str(m['sha256']).lower(): raise SystemExit('manifest package sha mismatch')
          paths={f.get('path'):f.get('sha256') for f in m['files'] if isinstance(f,dict)}
          for path in [
              'public/VERSION','public/lib/GroupMessageHandler.php',
              'public/lib/BotWebhookHandler.php','public/api/whatsapp-webhook.php',
              'public/settings.php','public/prayer-clock.php'
          ]:
              if path not in paths: raise SystemExit(f'missing required file {path}')
          print('bridge 3.1.5 validated')
          PY

      - name: Stage public update channel
        shell: bash
        run: |
          set -euo pipefail
          src=$(dirname "$(find /tmp/bridge315 -name latest.json -print -quit)")
          mkdir -p adminigreja-updates/releases
          rm -f adminigreja-updates/releases/v3.1.5.*.b64.txt
          cp "$src"/releases/v3.1.5.*.b64.txt adminigreja-updates/releases/
          cp "$src/latest.json" adminigreja-updates/latest.json

      - name: Commit public channel
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AdminIgreja Update Bot"
          git config user.email "actions@users.noreply.github.com"
          git add adminigreja-updates/latest.json adminigreja-updates/releases/v3.1.5.*.b64.txt
          git commit -m "Publish Igreja Master 3.1.5 update channel"
          git push
