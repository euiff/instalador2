name: Publish validated PHP 3.2.0 bridge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-validated-php-320.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download validated bridge artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-b21c-820e-b5aa-e2aa7671fb5e/raw?se=2026-10-08T08%3A44%3A39Z&sp=r&sv=2026-02-06&sr=b&scid=bf673db7-80ed-5e4c-98e6-6464d6385aff&skoid=db6dad9e-03ee-465b-aef6-ce0f63a161dc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-07T23%3A46%3A52Z&ske=2026-10-08T23%3A46%3A52Z&sks=b&skv=2026-02-06&sig=wqsq9VGZTneZgWuPGhJsI6wQg5nOoQYP%2BO2xgclycP4%3D' -o /tmp/bridge320.zip
          echo 'a1b5db05302a35d6ff83c27f41560e29384231748b93395f9cfabe14388725b4  /tmp/bridge320.zip' | sha256sum -c -
          rm -rf /tmp/bridge320
          mkdir -p /tmp/bridge320
          unzip -q /tmp/bridge320.zip -d /tmp/bridge320

      - name: Validate bridge content
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import base64, hashlib, json, pathlib

          root=pathlib.Path('/tmp/bridge320')
          latest=list(root.rglob('latest.json'))
          if len(latest)!=1:
              raise SystemExit(f'expected one latest.json, found {len(latest)}')
          src=latest[0].parent
          m=json.loads((src/'latest.json').read_text(encoding='utf-8'))

          if m.get('version')!='3.2.0':
              raise SystemExit(f"unexpected version: {m.get('version')}")
          if len(m.get('parts',[]))!=28:
              raise SystemExit('unexpected part count')
          if len(m.get('files',[]))!=119:
              raise SystemExit('unexpected file count')

          encoded=''.join((src/p).read_text(encoding='utf-8').strip() for p in m['parts'])
          gz=base64.b64decode(encoded,validate=True)
          got=hashlib.sha256(gz).hexdigest()
          if got!='3ef389b7822e4962c9d7d1674aa4853825899f6125d6e826be97a4b7db0a40ba':
              raise SystemExit(f'package sha mismatch: {got}')
          if got.lower()!=str(m['sha256']).lower():
              raise SystemExit('manifest package sha mismatch')

          paths={f.get('path'):f.get('sha256') for f in m['files'] if isinstance(f,dict)}
          required=[
              'public/VERSION',
              'public/CHANGELOG.md',
              'public/bible.php',
              'public/documents.php',
              'public/member-document-pdf.php',
              'public/lib/BotBibleFlow.php',
              'public/lib/BotEventFlow.php',
              'public/lib/BotDocumentFlow.php',
              'public/lib/MemberDocumentService.php',
              'public/lib/EngagementNotificationService.php',
              'public/lib/UploadService.php',
              'public/lib/SimplePdf.php',
              'public/finance.php',
              'public/report.php',
              'public/prayer-clock.php',
              'public/raffles.php',
              'public/events.php',
              'public/service-types.php',
              'public/database/018_media_reports_treasury.sql'
          ]
          for path in required:
              if path not in paths:
                  raise SystemExit(f'missing required file {path}')
          if 'public/config/database.php' in paths:
              raise SystemExit('local database config leaked into bridge')
          print('final bridge 3.2.0 validated')
          PY

      - name: Stage public update channel
        shell: bash
        run: |
          set -euo pipefail
          src=$(dirname "$(find /tmp/bridge320 -name latest.json -print -quit)")
          mkdir -p adminigreja-updates/releases
          rm -f adminigreja-updates/releases/v3.2.0.*.b64.txt
          cp "$src"/releases/v3.2.0.*.b64.txt adminigreja-updates/releases/
          cp "$src/latest.json" adminigreja-updates/latest.json

          python3 <<'PY'
          import base64, hashlib, json, pathlib
          root=pathlib.Path('adminigreja-updates')
          m=json.loads((root/'latest.json').read_text(encoding='utf-8'))
          encoded=''.join((root/p).read_text(encoding='utf-8').strip() for p in m['parts'])
          gz=base64.b64decode(encoded,validate=True)
          got=hashlib.sha256(gz).hexdigest()
          assert m['version']=='3.2.0'
          assert len(m['parts'])==28
          assert len(m['files'])==119
          assert got=='3ef389b7822e4962c9d7d1674aa4853825899f6125d6e826be97a4b7db0a40ba'
          assert got==m['sha256'].lower()
          print('final staged channel ok',got)
          PY

      - name: Commit public channel
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AdminIgreja Update Bot"
          git config user.email "actions@users.noreply.github.com"
          git add adminigreja-updates/latest.json adminigreja-updates/releases/v3.2.0.*.b64.txt
          git commit -m "Refresh Igreja Master 3.2.0 final update channel"
          git push
