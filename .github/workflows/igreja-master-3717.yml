name: Igreja Master 3.7.17 inspect courses
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/igreja-master-3.7.17-curso-manual
      - run: python3 adminigreja-updates/staging/3.7.17/source_overview.py
