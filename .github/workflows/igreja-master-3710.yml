name: Igreja Master 3.7.10 inspection
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/igreja-master-3.7.10-tesourarias-integradas
      - run: python3 adminigreja-updates/staging/3.7.10/inspect_release.py
