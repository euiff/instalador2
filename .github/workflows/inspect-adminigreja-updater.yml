name: Inspect AdminIgreja updater source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-adminigreja-updater.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct updater package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .inspect-updater inspect-adminigreja-updater
          mkdir -p .inspect-updater inspect-adminigreja-updater
          cat adminigreja-updates/releases/v2.1.1.hex*.txt | tr -d '\r\n' | xxd -r -p > .inspect-updater/package.tar.gz
          tar -xzf .inspect-updater/package.tar.gz -C .inspect-updater
          find .inspect-updater -maxdepth 4 -type f | sed 's#^.inspect-updater/##' | sort > inspect-adminigreja-updater/files.txt
          find .inspect-updater -type f -name 'updater.php' -print -quit | xargs -r -I{} cp {} inspect-adminigreja-updater/updater.php
      - name: Commit inspection
        shell: bash
        run: |
          git config user.name "AdminIgreja Inspect Bot"
          git config user.email "actions@users.noreply.github.com"
          git add inspect-adminigreja-updater
          git commit -m "Inspect AdminIgreja updater source" || exit 0
          git push
