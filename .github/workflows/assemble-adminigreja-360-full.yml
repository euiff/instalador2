name: Assemble AdminIgreja current 3.6.0 full source

on:
  push:
    paths:
      - '.github/workflows/assemble-adminigreja-360-full.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Assemble current source from release chain
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/adminigreja-current
          mkdir -p /tmp/adminigreja-current

          versions=(3.4.0 3.4.1 3.4.2 3.4.3 3.4.4 3.4.5 3.4.6 3.4.7 3.5.0 3.5.1 3.6.0)

          for v in "${versions[@]}"; do
            echo "Applying $v"
            cat adminigreja-updates/releases/v${v}.*.b64.txt | tr -d '\r\n' > /tmp/pkg-${v}.b64
            base64 -d /tmp/pkg-${v}.b64 > /tmp/pkg-${v}.tar.gz
            tar -xzf /tmp/pkg-${v}.tar.gz -C /tmp/adminigreja-current
          done

          test -f /tmp/adminigreja-current/public/VERSION
          echo "Assembled version: $(cat /tmp/adminigreja-current/public/VERSION)"
          test "$(cat /tmp/adminigreja-current/public/VERSION)" = "3.6.0"
          test -f /tmp/adminigreja-current/public/lib/PortalService.php
          test -f /tmp/adminigreja-current/public/master.php

      - name: Publish full work branch
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B work-3.6.1-full
          rm -rf work-3.6.1-full-source
          mkdir -p work-3.6.1-full-source
          cp -a /tmp/adminigreja-current/. work-3.6.1-full-source/
          git add work-3.6.1-full-source
          git config user.name "AdminIgreja Update Bot"
          git config user.email "actions@github.com"
          git commit -m "Assemble AdminIgreja 3.6.0 full source for 3.6.1 work"
          git push -f origin work-3.6.1-full
