name: Extract 3.2.2 card source

on:
  push:
    paths:
      - '.github/workflows/extract-322-card-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild 3.2.2 package
        shell: bash
        run: |
          set -euo pipefail
          cat adminigreja-updates/releases/v3.2.2.*.b64.txt | tr -d '\r\n' | base64 -d > /tmp/adminigreja-3.2.2.zip
          echo "360f414e8aebc82370207ce0eb2f8385dbee244c2da55ea1fe36baac9e82558a  /tmp/adminigreja-3.2.2.zip" | sha256sum -c -
          rm -rf /tmp/adminigreja-322
          mkdir -p /tmp/adminigreja-322
          unzip -q /tmp/adminigreja-3.2.2.zip -d /tmp/adminigreja-322

      - name: Publish current card-related source to work branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AdminIgreja Update Bot"
          git config user.email "actions@github.com"
          git checkout -B work-3.2.3
          rm -rf work-3.2.3-source
          mkdir -p work-3.2.3-source/public/lib work-3.2.3-source/public/assets
          cp /tmp/adminigreja-322/public/member-document-pdf.php work-3.2.3-source/public/
          cp /tmp/adminigreja-322/public/member-document.php work-3.2.3-source/public/
          cp /tmp/adminigreja-322/public/member-profile.php work-3.2.3-source/public/
          cp /tmp/adminigreja-322/public/members.php work-3.2.3-source/public/
          cp /tmp/adminigreja-322/public/verify.php work-3.2.3-source/public/
          cp /tmp/adminigreja-322/public/lib/MemberDocumentService.php work-3.2.3-source/public/lib/
          cp /tmp/adminigreja-322/public/lib/SimplePdf.php work-3.2.3-source/public/lib/
          cp /tmp/adminigreja-322/public/assets/app.css work-3.2.3-source/public/assets/
          cp /tmp/adminigreja-322/public/database/005_documents.sql work-3.2.3-source/public/ 2>/dev/null || true
          printf '3.2.2\n' > work-3.2.3-source/BASE_VERSION
          git add work-3.2.3-source
          git commit -m "Extract 3.2.2 card source for 3.2.3 work" || true
          git push --force origin work-3.2.3

# trigger extraction
