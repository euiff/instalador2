name: Igreja Master 3.7.22 inspect finance
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/igreja-master-3.7.22-caixa-pela-origem
      - run: python3 adminigreja-updates/staging/3.7.22/scope_inspect.py
