name: Publish AdminIgreja 2.4.2 Compact UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-adminigreja-242.yml'
      - 'adminigreja-build/v2.4.2/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct 2.4.1
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .build242
          mkdir -p .build242/work
          cat adminigreja-updates/releases/v2.4.1.*.b64.txt | tr -d '\r\n' | base64 -d > .build242/base.tar.gz
          echo "2338ee937093ce6e65a82495889f4830f54ab459ccbd9c0d1cfd6f0d2611183e  .build242/base.tar.gz" | sha256sum -c -
          tar -xzf .build242/base.tar.gz -C .build242/work

      - name: Apply compact visual refinements
        shell: bash
        run: |
          set -euo pipefail
          cat adminigreja-build/v2.4.2/compact-overrides.css >> .build242/work/assets/app.css
          cp .build242/work/assets/app.css .build242/work/public/assets/app.css
          printf '2.4.2\n' > .build242/work/VERSION

      - name: Bust browser CSS cache
        shell: python
        run: |
          from pathlib import Path
          p=Path('.build242/work/app/layout.php')
          s=p.read_text(encoding='utf-8')
          s=s.replace('href="/assets/app.css"', 'href="/assets/app.css?v=2.4.2"')
          p.write_text(s,encoding='utf-8')

      - name: Validate PHP and required UI rules
        shell: bash
        run: |
          set -euo pipefail
          php -l .build242/work/app/layout.php
          php -l .build242/work/public/index.php
          grep -q '#appSidebar .nav-icon svg' .build242/work/public/assets/app.css
          grep -q 'grid-template-columns:repeat(auto-fit,minmax(190px,1fr))' .build242/work/public/assets/app.css
          grep -q 'app.css?v=2.4.2' .build242/work/app/layout.php

      - name: Build legacy-compatible USTAR package
        shell: python
        run: |
          from pathlib import Path
          import base64,hashlib,json,tarfile,io,gzip

          root=Path('.build242/work')
          files=sorted([p for p in root.rglob('*') if p.is_file()],key=lambda p:p.relative_to(root).as_posix())

          tb=io.BytesIO()
          with tarfile.open(fileobj=tb,mode='w',format=tarfile.USTAR_FORMAT) as tf:
              for p in files:
                  rel=p.relative_to(root).as_posix()
                  info=tf.gettarinfo(str(p),arcname=rel)
                  info.uid=0; info.gid=0; info.uname=''; info.gname=''; info.mtime=0
                  with p.open('rb') as fh:
                      tf.addfile(info,fh)

          tar=tb.getvalue()
          pos=0
          while pos+512<=len(tar):
              h=tar[pos:pos+512]; pos+=512
              if h.strip(b'\0')==b'': break
              name=h[:100].rstrip(b'\0 ').decode()
              prefix=h[345:500].rstrip(b'\0 ').decode()
              if prefix: name=prefix+'/'+name
              size=int((h[124:136].rstrip(b'\0 ').strip() or b'0'),8)
              typ=h[156:157]
              if typ not in (b'0',b'\0'):
                  raise SystemExit(f'Forbidden TAR type {typ!r} for {name}')
              pos+=((size+511)//512)*512

          pkg=Path('.build242/v2.4.2.tar.gz')
          with pkg.open('wb') as out:
              with gzip.GzipFile(filename='',mode='wb',fileobj=out,mtime=0) as gz:
                  gz.write(tar)

          raw=pkg.read_bytes()
          enc=base64.b64encode(raw).decode()
          channel=Path('adminigreja-updates')
          rel=channel/'releases'
          rel.mkdir(parents=True,exist_ok=True)
          for old in rel.glob('v2.4.2.*.b64.txt'): old.unlink()

          parts=[]
          for idx,start in enumerate(range(0,len(enc),8000),1):
              name=f'releases/v2.4.2.{idx:02d}.b64.txt'
              (channel/name).write_text(enc[start:start+8000],encoding='utf-8')
              parts.append(name)

          manifest={
              'version':'2.4.2',
              'min_php':'8.0',
              'encoding':'base64',
              'parts':parts,
              'sha256':hashlib.sha256(raw).hexdigest(),
              'files':[
                  {'path':p.relative_to(root).as_posix(),'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
                  for p in files
              ]
          }
          (channel/'latest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('parts:',len(parts))
          print('sha256:',manifest['sha256'])

      - name: Publish channel
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AdminIgreja Update Bot"
          git config user.email "actions@users.noreply.github.com"
          git add adminigreja-updates/latest.json adminigreja-updates/releases/v2.4.2.*.b64.txt
          git commit -m "Publish AdminIgreja 2.4.2 compact modern interface"
          git push
