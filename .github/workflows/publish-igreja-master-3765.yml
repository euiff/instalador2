name: Publish Igreja Master 3.7.65 Faithful Finance Structure
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-igreja-master-3765.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: mastertest
          MYSQL_DATABASE: master_finance_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=4s
          --health-retries=25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, iconv, zip, xml, simplexml, pdo_mysql
          coverage: none
      - name: Validate PHP and migration safety
        shell: bash
        run: |
          set -euo pipefail
          s=adminigreja-updates/staging/3.7.65
          php -l "$s/public/master-finance-import.php"
          php -l "$s/public/lib/MasterFinanceImport.php"
          php -l "$s/public/lib/FinancePeriodGuard.php"
          php -l "$s/tests/master-import-structure-test.php"
          test "$(cat "$s/public/VERSION")" = "3.7.65"
          python3 - <<'PY'
          from pathlib import Path
          root=Path('adminigreja-updates/staging/3.7.65/public')
          page=(root/'master-finance-import.php').read_text()
          importer=(root/'lib/MasterFinanceImport.php').read_text()
          assert "requireRole('super_admin')" in page and "verify_csrf()" in page
          assert 'ack_missing_description' in page and 'ack_rounded' in page
          assert 'ack_zero' in page and 'ack_unknown' in page
          assert 'enctype="multipart/form-data"' in page and 'name="mapping[' in page
          assert 'rounded_value_lines' in importer and 'missing_description_lines' in importer
          assert 'SEM DESCRIÇÃO NO BACKUP' in importer
          assert 'PHP_ROUND_HALF_UP' in importer and "is_finite($amount)" in importer
          assert "'ç'=>'c'" in importer and "'ã'=>'a'" in importer
          assert "SELECT id FROM finance_entries WHERE church_id=?" in importer
          assert 'beginTransaction()' in importer and 'rollBack()' in importer
          assert 'platform_audit_logs' in importer
          assert 'DELETE FROM finance_entries' not in importer
          assert "INSERT INTO church_registers" in importer
          assert "INSERT INTO ministry_departments" in importer
          assert "choice==='auto'" in importer
          assert "'suggested_departments' =>" in importer
          assert "'categories' =>" in importer
          assert 'value="auto"' in page
          assert "preview['categories']" in page
          print('PASS static security and accounting validation')
          PY
      - name: Generate source-compatible synthetic XLSX with 7,589 historic transactions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import zipfile
          from decimal import Decimal
          from pathlib import Path
          from xml.sax.saxutils import escape
          headers=[
            'type','DESCRIÇÃO DO LANÇAMENTO','DATA','VALOR','CONTA/CAIXA DESTINO',
            'MEMBRO CONTRIBUINTE','Nº documento / cupom / referência Pix',
            'Forma de pagamento','Lançamento Contábil *'
          ]
          def addr(n):
            result=''
            while n:
              n,mod=divmod(n-1,26)
              result=chr(65+mod)+result
            return result
          def cell(n,row,x):
            ref=addr(n)+str(row)
            if isinstance(x,str):
              return '<c r="'+ref+'" t="inlineStr"><is><t>'+escape(x)+'</t></is></c>'
            return '<c r="'+ref+'"><v>'+str(x)+'</v></c>'
          incoming=0
          outgoing=0
          empty=0
          noise=0
          chunks=['<?xml version="1.0" encoding="UTF-8"?>',
            '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>']
          chunks.append('<row r="1">'+''.join(cell(k+1,1,s) for k,s in enumerate(headers))+'</row>')
          # Exact source account labels only, without donor or transaction data.
          cashboxes=[
            '3.2 - DÍZIMOS - CX IGREJA',
            '3.1 - OFERTAS CX. IGREJA',
            '4.2 - CONTRUÇÃO IDB CB',
            '1.2 - DPTO MULHER',
            '1.3 - DPTO JOVEM',
            '2.4 - AÇÃO SOCIAL',
            '4.3 - INVESTIMENTO NO RÁDIO',
            '2.6 - MIN. ENSINO',
            '1.5 - DPTO INFANTIL',
            '2.0 - MIN. CASAIS',
            '4.4 - RETIRO GERAL - 2023',
            '2.3 - MIN. LOUVOR',
            '4.1 - JANTAR 23/24',
            '2.2 - MIN. DANÇA',
            '1.4 - DPTO PRÉ ADOLESCENTES',
            '5.0 - CANTINA',
            '2.2.1 - MIN. LIVE & PROJEÇÃO',
            '6.0 - PROJ. CASA DO LEVITA',
            '2.5 - MISSÕES & EVANGELISMO',
            '1.1 - DPTO HOMEM',
            '2.1 - MIN. MARKETING',
          ]
          assert len(cashboxes)==21
          for i in range(7589):
            is_income=i<5909
            if i<5:amount='0'
            elif 200<=i<383:amount='129.91999999999999'
            elif i==5908:amount='1845533.66'
            elif i==7588:amount='927120.71'
            else:amount='10.55'
            cent=int(Decimal(amount).quantize(Decimal('0.01'))*100)
            if is_income:incoming+=cent
            else:outgoing+=cent
            if 200<=i<383:noise+=1
            missing=4000<=i<4014
            if missing:empty+=1
            values=[
              'Entrada' if is_income else 'Saída',
              '' if missing else 'Movimentação histórica '+str(i+1),
              46332 if i==7588 else 44544,
              amount,
              '#N/A' if i<9 else cashboxes[(i-9)%21],
              'Pessoa de Teste' if i==100 else '',
              'sistema-antigo','Outro',
              ('DÍZIMOS' if i%3==0 else 'OFERTAS GERAIS') if is_income
              else ('DÍZIMOS' if i%5==0 else ('OUTRAS DESPESAS' if i%5 in (1,4)
                    else ('ÁGUA' if i%5==3 else 'ENERGIA ELÉTRICA'))),
            ]
            row=i+2
            xml=[]
            for j,v in enumerate(values,1):
              if j in (3,4):xml.append('<c r="'+addr(j)+str(row)+'"><v>'+str(v)+'</v></c>')
              else:xml.append(cell(j,row,v))
            chunks.append('<row r="'+str(row)+'">'+''.join(xml)+'</row>')
          chunks.append('</sheetData></worksheet>')
          assert incoming==192965502,(incoming,'income')
          assert outgoing==94483416,(outgoing,'expense')
          assert noise==183 and empty==14
          output=Path('/tmp/master-finance-test.xlsx')
          with zipfile.ZipFile(output,'w',zipfile.ZIP_DEFLATED) as z:
            z.writestr('xl/worksheets/sheet1.xml',''.join(chunks))
          print('PASS synthetic source fixture:',7589,'rows, 183 float artifacts, 14 blank descriptions; exact amounts:',incoming,outgoing)
          PY
      - name: Integration test PHP XLSX import with MySQL
        shell: bash
        run: |
          set -euo pipefail
          LANG=C LC_ALL=C FINANCE_FIXTURE=/tmp/master-finance-test.xlsx php adminigreja-updates/staging/3.7.65/tests/master-import-structure-test.php
      - name: Package and publish incremental update
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,io,json,tarfile
          root=Path('adminigreja-updates')
          current=json.loads((root/'latest.json').read_text())
          if current['version']=='3.7.65':
              print('Already published');raise SystemExit(0)
          assert current['version']=='3.7.64', 'Unexpected previous version '+current['version']
          stage=root/'staging/3.7.65'
          paths=['public/lib/MasterFinanceImport.php','public/master-finance-import.php','public/VERSION']
          files={p:(stage/p).read_bytes() for p in paths}
          output=Path('/tmp/igreja-master-3765.tar.gz')
          with tarfile.open(output,'w:gz') as tar:
              for p in paths:tar.add(stage/p,arcname=p,recursive=False)
          data=output.read_bytes()
          with tarfile.open(fileobj=io.BytesIO(data),mode='r:gz') as tar:
              for p in paths:assert tar.extractfile(p).read()==files[p],p
          encoded=base64.b64encode(data)
          parts=[]
          for i in range(0,len(encoded),60000):
              part=f'releases/v3.7.65.{len(parts)+1:02d}.b64.txt'
              (root/part).write_bytes(encoded[i:i+60000]);parts.append(part)
          manifest={
            'version':'3.7.65','min_php':'8.1','encoding':'base64',
            'parts':parts,'sha256':hashlib.sha256(data).hexdigest(),
            'files':[{'path':p,'sha256':hashlib.sha256(files[p]).hexdigest()} for p in paths],
            'notes':[
              'Importação Master cria automaticamente os 21 caixas com códigos e nomes fiéis ao backup, reutilizando os existentes quando equivalentes.',
              'Categorias contábeis criadas ou ativadas na igreja: DÍZIMOS, OFERTAS GERAIS, OUTRAS DESPESAS, ÁGUA, ENERGIA ELÉTRICA.',
              'Departamentos e ministérios de códigos 1.x e 2.x são cadastrados com os respectivos caixas vinculados.',
              'Os nove movimentos de origem #N/A permanecem em caixa provisório de conferência, sem distribuição fictícia.',
              'Prévia mostra cinco lançamentos contábeis, treze departamentos e todos os caixas de origem; Master pode alterar destinos.',
              'Sem criar líderes ou vínculos de membros a departamentos inexistentes no backup; preserva contribuintes únicos.',
              'Operação única MySQL por igreja com rollback, auditoria, contas, departamentos e categorias em mesma transação.',
              'Validação com 7.589 linhas sintéticas, totais e bloqueio de reimportação, sem compartilhar movimentos reais.',
              'Nenhum movimento importado pela atualização: somente após o Master conferir e confirmar.'
            ]
          }
          (root/'latest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n')
          print('Release prepared, SHA256',manifest['sha256'])
          PY
          git config user.name "Igreja Master Update Bot"
          git config user.email "actions@users.noreply.github.com"
          git add adminigreja-updates/latest.json adminigreja-updates/releases/v3.7.65.*.b64.txt
          git diff --cached --quiet && exit 0
          git commit -m "Publish Igreja Master 3.7.65: preserve original boxes and categories"
          git pull --rebase origin main
          git push origin HEAD:main
