name: Publish Igreja Master 3.7.85 Finance Editor HTTP500 Recovery
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-igreja-master-3785.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Validate protected editor fallback and diagnostic handling
        shell: bash
        run: |
          set -euo pipefail
          root=adminigreja-updates/staging/3.7.85/public
          php -l "$root/finance.php"
          php -l "$root/finance-entry-edit.php"
          python3 - <<'PY'
          from pathlib import Path
          root=Path('adminigreja-updates/staging/3.7.85/public')
          f=(root/'finance.php').read_text()
          e=(root/'finance-entry-edit.php').read_text()
          assert (root/'VERSION').read_text().strip()=='3.7.85'
          assert "require __DIR__.'/finance-entry-edit.php';" in f
          assert 'catch(Throwable $error)' in f
          assert "error_log('Igreja Master '.$reference" in f
          assert '$auth->isSuperAdmin() && $auth->isMasterSupportMode()' in f
          assert "htmlspecialchars(basename($error->getFile())" in f
          assert 'get_class($error)' in f
          assert 'Não foi possível abrir este lançamento' in f
          assert 'WHERE e.church_id=? AND e.id=? LIMIT 1' in e
          assert "if(!empty($entry['is_grouped']))" in e
          assert e.count('catch(PDOException $failure)')>=3
          assert 'Não foi possível carregar a lista de documentos' in e
          assert 'FinancePeriodGuard::assertOpen' in e
          assert 'verify_csrf()' in e
          assert "href=\"#attach-documents\"" in e
          assert 'data-finance-preview' in e
          assert '<th>Docs.</th><th>Ações</th><th>Data</th>' in f
          assert 'DROP TABLE' not in f and 'DROP TABLE' not in e
          print('PASS: PHP syntax, safe diagnostics, optional-query fallbacks, existing finance routes and guards')
          PY
      - name: Publish incremental patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64,io,json,hashlib,tarfile
          root=Path('adminigreja-updates')
          m=root/'latest.json'
          current=json.loads(m.read_text())
          if current['version']=='3.7.85':
              print('3.7.85 already published')
              raise SystemExit(0)
          assert current['version']=='3.7.84','Unexpected predecessor '+str(current['version'])
          staged=root/'staging/3.7.85'
          paths=['public/finance.php','public/finance-entry-edit.php','public/VERSION']
          files={p:(staged/p).read_bytes() for p in paths}
          buf=io.BytesIO()
          with tarfile.open(fileobj=buf,mode='w:gz') as tar:
              for p in paths:tar.add(staged/p,arcname=p,recursive=False)
          binary=buf.getvalue()
          with tarfile.open(fileobj=io.BytesIO(binary),mode='r:gz') as tar:
              for p in paths:assert tar.extractfile(p).read()==files[p]
          encoded=base64.b64encode(binary)
          parts=[]
          for start in range(0,len(encoded),60000):
              name=f'releases/v3.7.85.{len(parts)+1:02d}.b64.txt'
              (root/name).write_bytes(encoded[start:start+60000])
              parts.append(name)
          update={
              'version':'3.7.85','min_php':'8.1','encoding':'base64',
              'parts':parts,'sha256':hashlib.sha256(binary).hexdigest(),
              'files':[{'path':p,'sha256':hashlib.sha256(data).hexdigest()} for p,data in files.items()],
              'notes':[
                  'Tratamento de HTTP 500 na tela Editar/Anexar: falhas inesperadas são registradas com identificador FIN- e exibidas sem detalhes sensíveis.',
                  'O perfil Master em modo suporte pode visualizar a classe da exceção, arquivo e linha para diagnóstico sem precisar expor senhas ou SQL.',
                  'Consultas opcionais de itens agrupados, documentos e contas agora têm tratamento de falhas de banco, evitando bloquear toda a tela quando há incompatibilidade de esquema.',
                  'Os arquivos e valores existentes não são alterados por esta atualização.',
                  'Os botões Editar e Anexar continuam pelo finance.php, com as seções apropriadas, documentos e leitor com zoom preservados.',
                  'Esta atualização visa recuperar o carregamento e identificar a causa real restante; um teste autenticado na hospedagem é necessário para confirmar a correção completa.'
              ]}
          m.write_text(json.dumps(update,ensure_ascii=False,indent=2)+'\n')
          print('Prepared 3.7.85',len(paths),'files',len(parts),'parts')
          PY
          git config user.name "Igreja Master Update Bot"
          git config user.email "actions@users.noreply.github.com"
          git add adminigreja-updates/latest.json adminigreja-updates/releases/v3.7.85.*.b64.txt
          git diff --cached --quiet && exit 0
          git commit -m "Publish Igreja Master 3.7.85 finance editor error recovery diagnostics"
          git pull --rebase origin main
          git push origin HEAD:main
