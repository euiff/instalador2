name: Publish AdminIgreja 2.1.3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-adminigreja-213.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build 2.1.3 from report-enabled 2.1.2 package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .adminigreja213
          mkdir -p .adminigreja213/work
          xxd -r -p adminigreja-updates/releases/v2.1.2.hex.txt > .adminigreja213/v212.tar.gz
          tar -xzf .adminigreja213/v212.tar.gz -C .adminigreja213/work
          printf '2.1.3\n' > .adminigreja213/work/VERSION
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -czf .adminigreja213/v213.tar.gz -C .adminigreja213/work VERSION public/index.php assets/app.css public/assets/app.css
          xxd -p -c 1000000 .adminigreja213/v213.tar.gz > adminigreja-updates/releases/v2.1.3.hex.txt

      - name: Generate latest manifest
        shell: python
        run: |
          from pathlib import Path
          import hashlib, json
          root=Path('.adminigreja213/work')
          pkg=Path('.adminigreja213/v213.tar.gz').read_bytes()
          rels=['VERSION','public/index.php','assets/app.css','public/assets/app.css']
          manifest={
              'version':'2.1.3',
              'min_php':'8.0',
              'encoding':'hex',
              'parts':['releases/v2.1.3.hex.txt'],
              'sha256':hashlib.sha256(pkg).hexdigest(),
              'files':[{'path':r,'sha256':hashlib.sha256((root/r).read_bytes()).hexdigest()} for r in rels]
          }
          Path('adminigreja-updates/latest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

      - name: Verify reports are present
        shell: bash
        run: |
          grep -q 'Imprimir relatório' .adminigreja213/work/public/index.php
          grep -q 'Relatório semanal' .adminigreja213/work/public/index.php
          grep -q 'Relatório mensal' .adminigreja213/work/public/index.php

      - name: Commit release
        shell: bash
        run: |
          git config user.name "AdminIgreja Update Bot"
          git config user.email "actions@users.noreply.github.com"
          git add adminigreja-updates/latest.json adminigreja-updates/releases/v2.1.3.hex.txt
          git commit -m "Publish AdminIgreja 2.1.3 printable reports"
          git push
