name: Publish AdminIgreja 3.2.8 unified documents

on:
  push:
    paths:
      - '.github/workflows/publish-adminigreja-328.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: channel
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          ref: work-3.2.3
          path: source
          fetch-depth: 1

      - name: Validate application PHP
        shell: bash
        run: |
          set -euo pipefail
          php -l source/work-3.2.3-source/public/lib/MemberDocumentTemplate.php
          php -l source/work-3.2.3-source/public/lib/UnifiedMemberDocumentService.php
          php -l source/work-3.2.3-source/public/lib/BotDocumentFlow.php
          php -l source/work-3.2.3-source/public/member-document.php
          php -l source/work-3.2.3-source/public/member-document-pdf.php

      - name: Install local PDF and QR renderer
        shell: bash
        run: |
          set -euo pipefail
          composer install             --working-dir=source/work-3.2.3-source/public             --no-dev             --prefer-dist             --optimize-autoloader             --no-interaction

      - name: Smoke test unified HTML to PDF rendering
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/test-unified-doc.php <<'PHP'
          <?php
          require 'source/work-3.2.3-source/public/vendor/autoload.php';
          require 'source/work-3.2.3-source/public/lib/MemberDocumentTemplate.php';

          $church=[
            'name'=>'Casa da Bênção',
            'pastor_name'=>'Pastor Responsável',
            'address'=>'Rua Exemplo, 123',
            'public_url'=>'https://example.org',
          ];
          $member=[
            'id'=>'11111111-1111-1111-1111-111111111111',
            'name'=>'Membro de Teste',
            'cpf'=>'000.000.000-00',
            'rg'=>'0000000',
            'role'=>'Membro',
            'department'=>'Louvor',
            'marital_status'=>'Casado',
            'naturalness'=>'Catalão - GO',
            'membership_date'=>'2024-01-10',
            'birth_date'=>'1990-01-01',
            'baptism_date'=>'2024-02-10',
            'baptism_church'=>'Casa da Bênção',
            'baptism_pastor'=>'Pastor Responsável',
            'is_baptized'=>1,
            'congregation_name'=>'Sede',
            'congregation_address'=>'Rua Exemplo, 123',
            'congregation_pastor'=>'Pastor Responsável',
            'congregation_signature'=>'',
            'congregation_logo'=>'',
            'mother_name'=>'Maria',
            'father_name'=>'José',
            'photo_url'=>'',
          ];

          $template=new MemberDocumentTemplate('source/work-3.2.3-source/public');
          $html=$template->render($church,$member,'baptism_certificate','Certificado de Batismo','BAP-TESTE-VALIDACAO');

          if(!str_contains($html,'BAP-TESTE-VALIDACAO'))throw new RuntimeException('Verification code missing');
          if(!str_contains($html,'data:image/svg+xml;base64,'))throw new RuntimeException('QR code missing');

          $opts=new Dompdf\Options();
          $opts->set('isRemoteEnabled',true);
          $opts->set('isHtml5ParserEnabled',true);
          $opts->set('defaultFont','DejaVu Sans');
          $opts->setChroot('source/work-3.2.3-source/public');

          $pdf=new Dompdf\Dompdf($opts);
          $pdf->loadHtml($html,'UTF-8');
          $pdf->setPaper('A4','portrait');
          $pdf->render();
          $bytes=$pdf->output();

          if(!str_starts_with($bytes,'%PDF-'))throw new RuntimeException('Invalid PDF');
          if(strlen($bytes)<8000)throw new RuntimeException('PDF unexpectedly small: '.strlen($bytes));

          file_put_contents('/tmp/unified-document-test.pdf',$bytes);
          echo "PDF_OK ".strlen($bytes)." bytes\n";
          PHP
          php /tmp/test-unified-doc.php

      - name: Build update package
        shell: bash
        run: |
          set -euo pipefail
          cd source/work-3.2.3-source

          tar -czf /tmp/adminigreja-3.2.8.tar.gz             public/lib/MemberDocumentTemplate.php             public/lib/UnifiedMemberDocumentService.php             public/lib/BotDocumentFlow.php             public/member-document.php             public/member-document-pdf.php             public/composer.json             public/composer.lock             public/vendor             public/VERSION             public/CHANGELOG.md

          cd ../../channel
          rm -f adminigreja-updates/releases/v3.2.8.*.b64.txt
          base64 -w0 /tmp/adminigreja-3.2.8.tar.gz > /tmp/adminigreja-3.2.8.b64
          split -b 300000 -d -a 2 /tmp/adminigreja-3.2.8.b64 /tmp/v3.2.8.

          i=1
          for f in /tmp/v3.2.8.*; do
            printf -v n "%02d" "$i"
            cp "$f" "adminigreja-updates/releases/v3.2.8.$n.b64.txt"
            i=$((i+1))
          done

          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path

          channel=Path("adminigreja-updates")
          source=Path("../source/work-3.2.3-source")
          release=channel/"releases"
          package=Path("/tmp/adminigreja-3.2.8.tar.gz")
          parts=sorted(release.glob("v3.2.8.*.b64.txt"))

          roots=[
              source/"public/lib/MemberDocumentTemplate.php",
              source/"public/lib/UnifiedMemberDocumentService.php",
              source/"public/lib/BotDocumentFlow.php",
              source/"public/member-document.php",
              source/"public/member-document-pdf.php",
              source/"public/composer.json",
              source/"public/composer.lock",
              source/"public/VERSION",
              source/"public/CHANGELOG.md",
          ]
          roots += sorted((source/"public/vendor").rglob("*"))

          files=[]
          for p in roots:
              if not p.is_file():
                  continue
              rel=p.relative_to(source).as_posix()
              files.append({
                  "path": rel,
                  "sha256": hashlib.sha256(p.read_bytes()).hexdigest()
              })

          manifest={
              "version":"3.2.8",
              "min_php":"8.1",
              "encoding":"base64",
              "parts":[f"releases/{p.name}" for p in parts],
              "sha256":hashlib.sha256(package.read_bytes()).hexdigest(),
              "files":files,
          }

          (channel/"latest.json").write_text(
              json.dumps(manifest,ensure_ascii=False,indent=2)+"\n",
              encoding="utf-8"
          )
          print("files",len(files),"parts",len(parts),"package",package.stat().st_size)
          PY

      - name: Verify packaged files
        shell: bash
        run: |
          set -euo pipefail
          cd channel
          cat adminigreja-updates/releases/v3.2.8.*.b64.txt | tr -d '\r\n' | base64 -d > /tmp/rebuilt-3.2.8.tar.gz
          expected="$(python3 -c 'import json;print(json.load(open("adminigreja-updates/latest.json"))["sha256"])')"
          actual="$(sha256sum /tmp/rebuilt-3.2.8.tar.gz | awk '{print $1}')"
          test "$expected" = "$actual"

          rm -rf /tmp/test328
          mkdir -p /tmp/test328
          tar -xzf /tmp/rebuilt-3.2.8.tar.gz -C /tmp/test328

          php -l /tmp/test328/public/lib/MemberDocumentTemplate.php
          php -l /tmp/test328/public/lib/UnifiedMemberDocumentService.php
          test -f /tmp/test328/public/vendor/autoload.php

      - name: Publish 3.2.8
        shell: bash
        run: |
          set -euo pipefail
          cd channel
          git config user.name "AdminIgreja Update Bot"
          git config user.email "actions@github.com"
          git add adminigreja-updates/latest.json adminigreja-updates/releases/v3.2.8.*.b64.txt
          git commit -m "Publish AdminIgreja 3.2.8 unified document renderer"
          git pull --rebase origin main
          git push origin main
