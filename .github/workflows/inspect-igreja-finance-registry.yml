name: Inspect Igreja Finance Registry Before Legacy Import
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-igreja-finance-registry.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show original registry APIs and schema
        shell: bash
        run: |
          python3 - <<'PY'
          import json,base64,tarfile,io
          bundle=json.load(open('adminigreja-updates/staging/v3.7.24-full-bundle.json'))
          archive=tarfile.open(fileobj=io.BytesIO(base64.b64decode(bundle['base64'])),mode='r:gz')
          targets=[
            'public/lib/RegistryService.php',
            'public/database/028_finance_registers_receivables.sql',
            'public/registers.php',
            'public/database/042_enuves_migration.sql',
            'public/database/043_member_departments.sql',
            'public/lib/EnuvesImportService.php',
          # scan all bundled text for unique departmental account key

          ]
          for target in targets:
            print('====== BEGIN '+target+' ======')
            data=archive.extractfile(target).read().decode('utf-8')
            if target.endswith('registers.php'):
              lines=data.splitlines()
              for i,line in enumerate(lines):
                if 'finance_category' in line or 'registry' in line.lower() or 'create(' in line or 'save(' in line:
                  print('%d %s'%(i+1,line[:220]))
            else:
              print(data[:24000])
            print('====== END '+target+' ======')
          for member in archive.getmembers():
            if not member.isfile() or not member.name.endswith(('.php','.sql','.md')):
              continue
            content=archive.extractfile(member).read().decode('utf-8','replace')
            for marker in ('uq_department_account','finance_accounts','CREATE TABLE IF NOT EXISTS ministry_departments'):
              if marker not in content:continue
              if marker=='finance_accounts' and 'uq_department_account' not in content:continue
              for n,line in enumerate(content.splitlines()):
                if marker in line:
                  print('MIGRATION_SCAN',member.name,'line',n+1,repr('\n'.join(content.splitlines()[max(0,n-4):n+5])))
          PY
